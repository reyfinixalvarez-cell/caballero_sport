<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finalizar compra | Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="checkout">
    <div id="site-header"></div>

    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="content-panel">
                    <span class="section-kicker">Checkout</span>
                    <h1>Confirmacion de pedido</h1>
                    <form id="checkout-form" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Direccion de envio</label>
                            <input type="text" id="checkout-direccion" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Metodo de pago</label>
                            <input type="text" class="form-control" value="Compra simulada" disabled>
                        </div>
                        <button class="btn btn-primary w-100" type="submit" id="checkout-btn">Confirmar pedido</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
