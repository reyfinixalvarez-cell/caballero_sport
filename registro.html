<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="registro">
    <div id="site-header"></div>

    <section class="auth-section">
        <div class="auth-card">
            <h1>Crear cuenta</h1>
            <form id="registro-form" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" id="reg-nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" id="reg-correo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contrasena</label>
                    <input type="password" id="reg-pass" class="form-control" minlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefono</label>
                    <input type="text" id="reg-tel" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Direccion</label>
                    <input type="text" id="reg-dir" class="form-control">
                </div>
                <button class="btn btn-primary w-100" type="submit">Registrarse</button>
            </form>
            <p class="text-center mt-3 mb-0">Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
        </div>
    </section>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
