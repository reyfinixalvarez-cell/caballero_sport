<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contrasena | Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="recuperar">
    <div id="site-header"></div>

    <section class="auth-section">
        <div class="auth-card">
            <h1>Recuperar contrasena</h1>
            <form id="recuperar-form">
                <div class="mb-3">
                    <label class="form-label">Correo registrado</label>
                    <input type="email" id="rec-correo" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Generar token</button>
            </form>
            <div id="token-result"></div>
        </div>
    </section>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
