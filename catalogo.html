<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogo | Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="catalogo">
    <div id="site-header"></div>

    <section class="page-heading">
        <div class="container">
            <span class="section-kicker">Catalogo</span>
            <h1>Encuentra tus zapatillas</h1>
        </div>
    </section>

    <section class="container py-5">
        <form class="filter-panel mb-4" method="get" action="catalogo.html">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Colores</label>
                    <select class="form-select" name="color" id="filter-color"></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Buscar</label>
                    <input type="search" name="q" id="filter-q" class="form-control" placeholder="Nombre, marca o descripcion">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Marca</label>
                    <select name="marca" id="filter-marca" class="form-select"></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Categoria</label>
                    <select name="categoria" id="filter-categoria" class="form-select"></select>
                </div>
                <div class="col-md-1">
                    <label class="form-label">Min</label>
                    <input type="number" name="min" id="filter-min" class="form-control" min="0">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Max</label>
                    <input type="number" name="max" id="filter-max" class="form-control" min="0">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-primary flex-fill" type="submit">Filtrar</button>
                    <a class="btn btn-outline-secondary" href="catalogo.html"><i class="bi bi-x-lg"></i></a>
                </div>
            </div>
        </form>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="mb-0 text-muted" id="catalog-count">0 producto(s) encontrados</p>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-danger" href="catalogo.html?oferta=1">Ofertas</a>
                <a class="btn btn-sm btn-outline-success" href="catalogo.html?nuevo=1">Nuevos</a>
            </div>
        </div>

        <div class="row g-4" id="catalog-grid"></div>
    </section>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
