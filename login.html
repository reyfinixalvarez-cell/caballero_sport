<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesion | Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="login">
    <div id="site-header"></div>

    <section class="auth-section">
        <div class="auth-card">
            <h1>Iniciar sesion</h1>
            <form id="login-form" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" id="login-correo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contrasena</label>
                    <input type="password" id="login-pass" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
            <div class="d-flex justify-content-between mt-3">
                <a href="recuperar.html">Olvide mi contrasena</a>
                <a href="registro.html">Crear cuenta</a>
            </div>
            <div class="admin-hint mt-4">
                <strong>Admin inicial:</strong><br>
                Correo: <code>admin@caballerosport.com</code><br>
                Contrasena: <code>123456</code>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
