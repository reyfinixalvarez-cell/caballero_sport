<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar perfil | Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="perfil">
    <div id="site-header"></div>

    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="content-panel">
                    <h1>Editar perfil</h1>
                    <form id="perfil-form" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="perf-nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo</label>
                                <input type="email" id="perf-correo" class="form-control" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telefono</label>
                                <input type="text" id="perf-telefono" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nueva contrasena</label>
                                <input type="password" id="perf-pass" class="form-control" minlength="6">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Direccion</label>
                                <input type="text" id="perf-direccion" class="form-control">
                            </div>
                        </div>
                        <button class="btn btn-primary mt-4" type="submit">Guardar cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
