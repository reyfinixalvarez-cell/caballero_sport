<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos | Admin Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body class="admin-body" data-page="adminProductos">
    <div id="admin-header"></div>

    <main class="container pb-5">
        <div class="admin-heading"><h1>Productos</h1></div>
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="content-panel">
                    <h2 id="prod-form-title">Agregar producto</h2>
                    <form id="admin-prod-form">
                        <input type="hidden" id="prod-id" value="0">
                        <div class="mb-2">
                            <label class="form-label">Categoria</label>
                            <select id="prod-categoria" class="form-select" required></select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="prod-nombre" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Marca</label>
                            <input type="text" id="prod-marca" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Talla</label>
                            <input type="text" id="prod-talla" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Color</label>
                            <input type="text" id="prod-color" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Imagen</label>
                            <input type="text" id="prod-imagen" class="form-control" value="placeholder.svg" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Descripcion</label>
                            <textarea id="prod-descripcion" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="row g-2">
                            <div class="col-4"><label class="form-label">Precio</label><input type="number" step="0.01" id="prod-precio" class="form-control" required></div>
                            <div class="col-4"><label class="form-label">Oferta</label><input type="number" step="0.01" id="prod-oferta" class="form-control"></div>
                            <div class="col-4"><label class="form-label">Stock</label><input type="number" id="prod-stock" class="form-control" value="0" required></div>
                        </div>
                        <div class="d-flex gap-3 my-3">
                            <label><input type="checkbox" id="prod-destacado"> Destacado</label>
                            <label><input type="checkbox" id="prod-nuevo"> Nuevo</label>
                            <label><input type="checkbox" id="prod-estado" checked> Activo</label>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Guardar</button>
                        <div id="prod-cancel-wrap"></div>
                    </form>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="content-panel table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Producto</th><th>Marca</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
                        <tbody id="admin-prod-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
