<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias | Admin Caballero Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body class="admin-body" data-page="adminCategorias">
    <div id="admin-header"></div>

    <main class="container pb-5">
        <div class="admin-heading"><h1>Categorias</h1></div>
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="content-panel">
                    <h2 id="cat-form-title">Agregar categoria</h2>
                    <form id="admin-cat-form">
                        <input type="hidden" id="cat-id" value="0">
                        <div class="mb-3"><label class="form-label">Nombre</label><input type="text" id="cat-nombre" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Descripcion</label><textarea id="cat-desc" class="form-control"></textarea></div>
                        <label class="mb-3"><input type="checkbox" id="cat-estado" checked> Activa</label>
                        <button class="btn btn-primary w-100" type="submit">Guardar</button>
                    </form>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="content-panel table-responsive">
                    <table class="table">
                        <thead><tr><th>Nombre</th><th>Descripcion</th><th>Estado</th><th></th></tr></thead>
                        <tbody id="admin-cat-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
